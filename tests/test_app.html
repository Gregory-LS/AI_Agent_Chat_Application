<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>app.js Tests</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; background: #f5f5f5; }
    #output { white-space: pre-wrap; background: #fff; padding: 1rem; border-radius: 4px; border: 1px solid #ddd; }
  </style>
</head>
<body>
  <h1>app.js Tests</h1>
  <pre id="output">Running tests...\n</pre>
  
  <script>
    // Override console.log to show in the page
    const output = document.getElementById('output');
    const originalLog = console.log;
    console.log = function(...args) {
      output.textContent += args.join(' ') + '\n';
      originalLog.apply(console, args);
    };
    console.error = function(...args) {
      output.textContent += 'ERROR: ' + args.join(' ') + '\n';
    };
  </script>
  
  <!-- Include the app.js code (we need just the functions, not the DOMContentLoaded) -->
  <script>
    // Copy of app.js state and functions (without DOMContentLoaded)
    // We'll import the actual app.js but need to avoid the init
    // For testing, we redefine the functions here
    
    // State
    const state = {
      conversations: [],
      currentConversationId: null,
      messages: [],
      streaming: false,
      abortController: null,
      config: {
        apiKey: '',
        defaultModel: '',
        theme: 'light'
      },
      skills: [],
      activeSkills: [],
      models: [],
      balance: null,
      selectedModel: null,
      searchQuery: '',
      conversationSearchQuery: ''
    };

    function uuid() { return crypto.randomUUID(); }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    async function apiRequest(method, path, body) {
      const options = {
        method,
        headers: { 'Content-Type': 'application/json' }
      };
      if (body !== undefined) {
        options.body = JSON.stringify(body);
      }
      const resp = await fetch(path, options);
      if (!resp.ok) {
        const err = await resp.text();
        throw new Error(`API ${method} ${path} failed: ${resp.status} ${err}`);
      }
      return resp.json();
    }

    async function loadConversations() {
      const data = await apiRequest('GET', '/api/conversations');
      state.conversations = data;
    }

    async function createConversation() {
      const conversation = {
        id: uuid(),
        title: 'New conversation',
        messages: [],
        model: state.selectedModel || state.config.defaultModel || '',
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
      await apiRequest('POST', '/api/conversations', conversation);
      state.conversations.unshift(conversation);
      state.currentConversationId = conversation.id;
      state.messages = [];
      return conversation;
    }

    async function loadConversation(id) {
      const conversation = await apiRequest('GET', `/api/conversations/${id}`);
      state.currentConversationId = id;
      state.messages = conversation.messages || [];
      state.selectedModel = conversation.model || state.config.defaultModel;
    }

    async function deleteConversation(id) {
      await apiRequest('DELETE', `/api/conversations/${id}`);
      state.conversations = state.conversations.filter(c => c.id !== id);
      if (state.currentConversationId === id) {
        state.currentConversationId = null;
        state.messages = [];
      }
    }

    async function renameConversation(id, title) {
      await apiRequest('PATCH', `/api/conversations/${id}`, { title });
      const conversation = state.conversations.find(c => c.id === id);
      if (conversation) {
        conversation.title = title;
      }
    }

    function addMessage(role, content, model = null) {
      const message = {
        id: uuid(),
        role,
        content,
        model,
        timestamp: new Date().toISOString()
      };
      state.messages.push(message);
      return message;
    }

    function updateLastMessage(content) {
      if (state.messages.length === 0) return;
      state.messages[state.messages.length - 1].content = content;
    }

    function clearMessages() {
      state.messages = [];
    }

    function toggleSkill(id) {
      const idx = state.activeSkills.indexOf(id);
      if (idx === -1) {
        state.activeSkills.push(id);
      } else {
        state.activeSkills.splice(idx, 1);
      }
    }

    function renderMarkdown(text) {
      let html = escapeHtml(text);
      html = html.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
      html = html.replace(/\n/g, '<br>');
      return html;
    }
  </script>
  
  <script src="test_app.js"></script>
</body>
</html>
