<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Model Picker</title>
<style>
  :root { --bg: #f7f7f8; --surface: #ffffff; --border: #e5e5e5; --text: #1f1f1f; --muted: #6e6e6e; --accent: #10a37f; --star: #f5b301; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
  .model-picker { max-width: 480px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); overflow: hidden; }
  .picker-header { padding: 16px 16px 8px; border-bottom: 1px solid var(--border); }
  .picker-title { font-size: 16px; font-weight: 600; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; }
  .search-input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; }
  .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(16,163,127,0.15); }
  .picker-tabs { display: flex; gap: 4px; padding: 8px 16px; border-bottom: 1px solid var(--border); }
  .tab { border: none; background: transparent; padding: 6px 10px; border-radius: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .tab.active { background: rgba(16,163,127,0.1); color: var(--accent); font-weight: 600; }
  .model-list { list-style: none; margin: 0; padding: 8px; max-height: 320px; overflow-y: auto; }
  .model-item { display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-radius: 8px; cursor: pointer; }
  .model-item:hover { background: #f0f0f0; }
  .model-info { flex: 1; min-width: 0; }
  .model-name { font-size: 14px; font-weight: 600; color: var(--text); }
  .model-meta { font-size: 12px; color: var(--muted); margin-top: 2px; display: flex; flex-wrap: wrap; gap: 6px; }
  .badge { background: #efefef; border-radius: 4px; padding: 1px 5px; font-size: 11px; }
  .fav-btn { background: none; border: none; font-size: 18px; cursor: pointer; color: #ccc; padding: 4px; }
  .fav-btn.active { color: var(--star); }
  .empty { padding: 16px; text-align: center; color: var(--muted); font-size: 13px; }
  .recent-time { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<div class='model-picker' data-model-picker>
  <div class='picker-header'>
    <div class='picker-title'>Models <span class='selected-model' data-selected-model>gpt-4o</span></div>
    <input class='search-input' type='search' placeholder='Search models...' aria-label='Search models' data-search-input>
  </div>
  <div class='picker-tabs' role='tablist'>
    <button class='tab active' role='tab' aria-selected='true' data-tab='favorites'>Favorites</button>
    <button class='tab' role='tab' aria-selected='false' data-tab='recent'>Recent</button>
    <button class='tab' role='tab' aria-selected='false' data-tab='all'>All models</button>
  </div>
  <ul class='model-list' data-model-list></ul>
</div>
<script>
  const models = [
    { id: 'gpt-4o', name: 'GPT-4o', provider: 'OpenAI', context: '128k', description: 'Flagship multimodal model', favorite: true, lastUsed: '2024-06-01T10:30:00Z' },
    { id: 'gpt-4o-mini', name: 'GPT-4o mini', provider: 'OpenAI', context: '128k', description: 'Fast affordable small model', favorite: false, lastUsed: '2024-06-01T09:15:00Z' },
    { id: 'claude-3-5-sonnet', name: 'Claude 3.5 Sonnet', provider: 'Anthropic', context: '200k', description: 'Balanced intelligence and speed', favorite: true, lastUsed: '2024-05-31T18:45:00Z' },
    { id: 'llama-3-1-70b', name: 'Llama 3.1 70B', provider: 'Meta', context: '128k', description: 'Open-weight large language model', favorite: false, lastUsed: null }
  ];
  const picker = document.querySelector('[data-model-picker]');
  const list = picker.querySelector('[data-model-list]');
  const searchInput = picker.querySelector('[data-search-input]');
  const tabs = Array.from(picker.querySelectorAll('[data-tab]'));
  let activeTab = 'favorites';
  let query = '';
  function formatTime(iso) {
    if (!iso) return '';
    const date = new Date(iso);
    const now = new Date();
    const diff = Math.round((now - date) / 60000);
    if (diff < 1) return 'just now';
    if (diff < 60) return diff + 'm ago';
    if (diff < 1440) return Math.round(diff / 60) + 'h ago';
    return date.toLocaleDateString();
  }
  function filteredModels() {
    let items = models.slice();
    if (activeTab === 'favorites') items = items.filter(function (m) { return m.favorite; });
    if (activeTab === 'recent') items = items.filter(function (m) { return m.lastUsed; }).sort(function (a, b) { return new Date(b.lastUsed) - new Date(a.lastUsed); });
    if (query) {
      const q = query.toLowerCase();
      items = items.filter(function (m) {
        return m.name.toLowerCase().indexOf(q) !== -1 || m.provider.toLowerCase().indexOf(q) !== -1 || m.description.toLowerCase().indexOf(q) !== -1;
      });
    }
    return items;
  }
  function render() {
    const items = filteredModels();
    list.innerHTML = '';
    if (items.length === 0) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = 'No models found';
      list.appendChild(li);
      return;
    }
    items.forEach(function (model) {
      const li = document.createElement('li');
      li.className = 'model-item';
      li.dataset.modelId = model.id;
      li.setAttribute('role', 'option');
      li.tabIndex = 0;
      const info = document.createElement('div');
      info.className = 'model-info';
      const name = document.createElement('div');
      name.className = 'model-name';
      name.textContent = model.name;
      const meta = document.createElement('div');
      meta.className = 'model-meta';
      const provider = document.createElement('span');
      provider.className = 'badge';
      provider.textContent = model.provider;
      const context = document.createElement('span');
      context.className = 'badge';
      context.textContent = model.context;
      meta.appendChild(provider);
      meta.appendChild(context);
      if (model.description) {
        const desc = document.createElement('span');
        desc.textContent = model.description;
        meta.appendChild(desc);
      }
      if (activeTab === 'recent' && model.lastUsed) {
        const time = document.createElement('span');
        time.className = 'recent-time';
        time.textContent = formatTime(model.lastUsed);
        meta.appendChild(time);
      }
      info.appendChild(name);
      info.appendChild(meta);
      const fav = document.createElement('button');
      fav.className = 'fav-btn' + (model.favorite ? ' active' : '');
      fav.setAttribute('aria-label', model.favorite ? 'Remove from favorites' : 'Add to favorites');
      fav.textContent = model.favorite ? '★' : '☆';
      fav.addEventListener('click', function (event) {
        event.stopPropagation();
        model.favorite = !model.favorite;
        render();
      });
      li.appendChild(info);
      li.appendChild(fav);
      li.addEventListener('click', function () {
        picker.querySelector('[data-selected-model]').textContent = model.name;
      });
      list.appendChild(li);
    });
  }
  tabs.forEach(function (tab) {
    tab.addEventListener('click', function () {
      tabs.forEach(function (t) { t.classList.remove('active'); t.setAttribute('aria-selected', 'false'); });
      tab.classList.add('active');
      tab.setAttribute('aria-selected', 'true');
      activeTab = tab.dataset.tab;
      render();
    });
  });
  searchInput.addEventListener('input', function () {
    query = searchInput.value;
    render();
  });
  render();
</script>
</body>
</html>
