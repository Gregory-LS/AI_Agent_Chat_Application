<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Composer Attachment Upload</title>
    <style>
        .upload-container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: Arial, sans-serif;
        }
        .upload-container h2 {
            margin-top: 0;
        }
        .upload-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .upload-form input[type="file"] {
            padding: 0.5rem;
        }
        .upload-form button {
            padding: 0.5rem 1rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .upload-form button:hover {
            background-color: #0056b3;
        }
        .preview-area {
            margin-top: 1rem;
            padding: 0.5rem;
            border: 1px dashed #ccc;
            border-radius: 4px;
            min-height: 50px;
        }
        .preview-area p {
            margin: 0;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="upload-container">
        <h2>Upload Attachment</h2>
        <form class="upload-form" id="uploadForm">
            <input type="file" id="fileInput" name="attachment" accept="image/*, .pdf, .doc, .docx, .txt" />
            <button type="submit">Upload</button>
        </form>
        <div class="preview-area" id="previewArea">
            <p>No file selected.</p>
        </div>
    </div>
    <script>
        document.getElementById('fileInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            const previewArea = document.getElementById('previewArea');
            if (file) {
                previewArea.innerHTML = '<p>Selected file: ' + file.name + ' (' + (file.size / 1024).toFixed(2) + ' KB)</p>';
            } else {
                previewArea.innerHTML = '<p>No file selected.</p>';
            }
        });

        document.getElementById('uploadForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            if (file) {
                // Placeholder for actual upload logic
                alert('Upload functionality not yet implemented. File "' + file.name + '" would be uploaded.');
            } else {
                alert('Please select a file first.');
            }
        });
    </script>
</body>
</html>
