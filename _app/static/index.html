<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentic Chat</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <link rel="stylesheet" href="/static/css/skeleton.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="conversations-list">
        <!-- Skeleton for conversation list -->
        <div id="conversations-skeleton" class="skeleton-loader">
          <div class="skeleton-item skeleton-conversation"></div>
          <div class="skeleton-item skeleton-conversation"></div>
          <div class="skeleton-item skeleton-conversation"></div>
          <div class="skeleton-item skeleton-conversation"></div>
          <div class="skeleton-item skeleton-conversation"></div>
        </div>
        <!-- Actual conversation items rendered by JS -->
        <div id="conversations-content" style="display:none;"></div>
      </div>
    </aside>
    <main id="chat-area">
      <!-- Skeleton for messages -->
      <div id="messages-skeleton" class="skeleton-loader">
        <div class="skeleton-item skeleton-message user"></div>
        <div class="skeleton-item skeleton-message assistant"></div>
        <div class="skeleton-item skeleton-message user"></div>
        <div class="skeleton-item skeleton-message assistant"></div>
      </div>
      <!-- Actual messages rendered by JS -->
      <div id="messages-content" style="display:none;"></div>
    </main>
    <div id="model-picker-container">
      <!-- Skeleton for model picker -->
      <div id="model-picker-skeleton" class="skeleton-loader">
        <div class="skeleton-item skeleton-search"></div>
        <div class="skeleton-item skeleton-model"></div>
        <div class="skeleton-item skeleton-model"></div>
        <div class="skeleton-item skeleton-model"></div>
        <div class="skeleton-item skeleton-model"></div>
      </div>
      <!-- Actual model picker rendered by JS -->
      <div id="model-picker-content" style="display:none;"></div>
    </div>
  </div>
  <script src="/static/js/app.js"></script>
</body>
</html>
