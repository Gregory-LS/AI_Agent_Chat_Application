<!DOCTYPE html><html lang="en" data-theme="dark"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agentic Chat</title><link rel="stylesheet" href="/static/styles.css"></head><body>
<div class=ap><div class=sb id=sb><div class=sh><h2>Chats</h2><button onclick=newChat()>+</button><button onclick=toggleSb() class=sc>x</button></div><div class=ss><input placeholder=Search oninput=searchC(this.value)></div><div class=cl id=cl></div></div>
<div class=mn><div class=hd><button onclick=toggleSb() class=sc>&#9776;</button><span class=mb id=mb onclick=mp.classList.add('open')>Select model</span><span class=sp></span><button onclick=toggleSkills()>&#128161;</button><button onclick=showSettings()>&#9881;</button></div>
<div class=ms id=ms><div class=wl id=wl><h1>Agentic Chat</h1><p>Your AI assistant. Select a model and start chatting!</p></div></div>
<div class=cp><div class=ir><textarea id=inp placeholder=Message... onkeydown="if(event.key==='Enter'&&!(event.shiftKey||event.ctrlKey||event.metaKey)){event.preventDefault();send()}"></textarea>
<button class="sb hid" id=sbBtn onclick=stopStream()>Stop</button><button id=sendBtn onclick=send()>Send</button></div></div></div></div>
<div class=sp id=sp><div class=sp-h><h3>Skills</h3><button class=sc onclick=showSkillEditor()>+ Add</button><button onclick=toggleSkills() class=sc>x</button></div><div class=sp-l id=sl></div></div>
<div class=mo id=mp><div class=md><h2>Select Model<button class=cl onclick=closeModals()>&times;</button></h2><div class=srch><input placeholder="Search models..." oninput=filterModels(this.value)></div><div class=ml id=ml></div></div></div>
<div class=mo id=settings><div class=md><h2>Settings<button class=cl onclick=closeModals()>&times;</button></h2><div class=fd><label>API Key</label><input id=apiKey></div><div class=fd><label>Default Model</label><select id=defModel></select></div><button onclick=saveSettings()>Save</button></div></div>
<div class=mo id=se><div class=md><h2 id=seTitle>Edit Skill<button class=cl onclick=closeModals()>&times;</button></h2><div class=fd><label>Name</label><input id=skName maxlength=80></div><div class=fd><label>Description</label><input id=skDesc maxlength=300></div><div class=fd><label>System Prompt</label><textarea id=skPrompt rows=6></textarea></div><button onclick=saveSkill()>Save</button></div></div>
<script src="/static/app.js"></script></body></html>
