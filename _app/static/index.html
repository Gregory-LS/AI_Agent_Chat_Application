<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentic Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Sidebar (placeholder) -->
    <aside id="sidebar">
      <div id="conversation-list"></div>
    </aside>

    <!-- Main chat area -->
    <main id="chat-container">
      <header id="chat-header">
        <h2>Chat</h2>
        <div id="model-picker"></div>
      </header>

      <div id="message-list"></div>

      <footer id="input-area">
        <!-- Attachment upload UI -->
        <div id="attachment-upload">
          <button id="attachment-button" type="button" title="Attach files">📎</button>
          <input type="file" id="file-input" multiple accept="image/*,.txt,.md,.csv,.json,.xml,.yaml,.yml,.log,.py,.js,.html,.css" hidden>
          <div id="attachment-preview"></div>
        </div>

        <textarea id="message-input" rows="1" placeholder="Send a message..."></textarea>
        <button id="send-button" type="button">Send</button>
      </footer>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
