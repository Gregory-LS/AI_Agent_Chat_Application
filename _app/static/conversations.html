<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversation Manager</title>
<link rel="stylesheet" href="conversation_management.css">
</head>
<body>
<header>
  <a href="/" class="back-link">&larr; Chat</a>
  <h1>Conversation Manager</h1>
</header>
<main>
  <section class="controls">
    <input type="search" id="search-input" placeholder="Search conversations..." autocomplete="off">
    <select id="filter-status">
      <option value="all">All</option>
      <option value="active">Active</option>
      <option value="archived">Archived</option>
    </select>
    <button id="export-all" class="btn">Export All</button>
    <label class="btn import-btn">
      Import
      <input type="file" id="import-file" accept="application/json,.json" hidden>
    </label>
  </section>
  <p id="status" role="status"></p>
  <div class="bulk-actions">
    <button id="bulk-archive" class="btn" disabled>Archive Selected</button>
    <button id="bulk-unarchive" class="btn" disabled>Unarchive Selected</button>
    <button id="bulk-export" class="btn" disabled>Export Selected</button>
    <button id="bulk-delete" class="btn danger" disabled>Delete Selected</button>
  </div>
  <table class="conversation-table">
    <thead>
      <tr>
        <th><input type="checkbox" id="select-all" aria-label="Select all"></th>
        <th>Title</th>
        <th>Last Updated</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="conversation-list"></tbody>
  </table>
  <p id="empty-message" class="empty"></p>
</main>
<script src="conversation_management.js"></script>
</body>
</html>
