<div id="confirmation-dialog" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="confirmation-dialog-title" hidden>
  <div class="modal-dialog">
    <div class="modal-header">
      <h2 id="confirmation-dialog-title" class="modal-title">Confirm Action</h2>
      <button class="modal-close" aria-label="Close dialog">&times;</button>
    </div>
    <div class="modal-body">
      <p id="confirmation-dialog-message">Are you sure you want to proceed?</p>
    </div>
    <div class="modal-footer">
      <button id="confirmation-dialog-cancel" class="btn btn-secondary" type="button">Cancel</button>
      <button id="confirmation-dialog-confirm" class="btn btn-danger" type="button">Confirm</button>
    </div>
  </div>
</div>
