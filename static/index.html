<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Skills Drawer</title>
  <link rel='stylesheet' href='/static/styles.css'>
</head>
<body>
  <main class='page'>
    <h1>Skills Manager</h1>
    <p>Open the skills drawer to manage your skills.</p>
    <button id='open-drawer' class='btn btn-primary' type='button' aria-haspopup='dialog' aria-controls='skills-drawer'>Open Skills Drawer</button>
  </main>

  <div class='drawer-overlay' id='drawer-overlay' hidden></div>
  <aside class='drawer' id='skills-drawer' role='dialog' aria-modal='true' aria-labelledby='drawer-title' hidden>
    <header class='drawer__header'>
      <h2 id='drawer-title'>Skills</h2>
      <button id='close-drawer' class='drawer__close' type='button' aria-label='Close drawer'>&times;</button>
    </header>
    <div class='drawer__content'>
      <form id='skill-form' class='skill-form'>
        <input type='hidden' id='skill-id'>
        <div class='form-group'>
          <label for='skill-name'>Name *</label>
          <input id='skill-name' name='name' type='text' required maxlength='100' placeholder='e.g. Python'>
        </div>
        <div class='form-group'>
          <label for='skill-category'>Category</label>
          <input id='skill-category' name='category' type='text' maxlength='50' placeholder='e.g. Backend'>
        </div>
        <div class='form-group'>
          <label for='skill-proficiency'>Proficiency (1-5)</label>
          <input id='skill-proficiency' name='proficiency' type='number' min='1' max='5' value='3' required>
        </div>
        <div class='form-group'>
          <label for='skill-description'>Description</label>
          <textarea id='skill-description' name='description' rows='3' maxlength='500' placeholder='Short description'></textarea>
        </div>
        <div class='form-actions'>
          <button type='submit' class='btn btn-primary' id='save-skill'>Save Skill</button>
          <button type='button' class='btn btn-secondary' id='reset-form'>Reset</button>
        </div>
        <p id='form-message' class='form-message' role='status'></p>
      </form>
      <section class='skills-section'>
        <h3>Saved Skills</h3>
        <ul id='skills-list' class='skills-list'></ul>
        <p id='empty-state' class='empty-state'>No skills added yet.</p>
      </section>
    </div>
  </aside>
  <script src='/static/app.js'></script>
</body>
</html>
