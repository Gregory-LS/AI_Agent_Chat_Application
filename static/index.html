<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Chat</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div id="app">
        <aside id="sidebar">
            <div class="sidebar-header">
                <h1>Agentic Chat</h1>
                <button id="new-chat-btn" title="New conversation">+</button>
            </div>
            <div id="conversation-list"></div>
            <div class="sidebar-footer">
                <button id="settings-btn" title="Settings">⚙️</button>
                <button id="skills-btn" title="Skills">🧠</button>
                <button id="logout-btn" title="Logout">🚪</button>
            </div>
        </aside>
        <main id="chat-area">
            <div id="messages"></div>
            <div id="composer">
                <textarea id="message-input" placeholder="Type a message..." rows="1"></textarea>
                <button id="send-btn">Send</button>
                <button id="stop-btn" style="display:none;">Stop</button>
            </div>
        </main>
    </div>

    <!-- Settings Drawer -->
    <div id="settings-drawer" class="drawer">
        <div class="drawer-header">
            <h2>Settings</h2>
            <button class="close-drawer">&times;</button>
        </div>
        <div class="drawer-body">
            <label>API Key</label>
            <input type="password" id="api-key-input" placeholder="sk-or-..." />
            <label>Default Model</label>
            <select id="default-model-select"></select>
            <label>Theme</label>
            <select id="theme-select">
                <option value="light">Light</option>
                <option value="dark">Dark</option>
            </select>
            <button id="save-settings-btn">Save</button>
        </div>
    </div>

    <!-- Skills Drawer -->
    <div id="skills-drawer" class="drawer">
        <div class="drawer-header">
            <h2>Skills</h2>
            <button class="close-drawer">&times;</button>
        </div>
        <div class="drawer-body" id="skills-list"></div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
