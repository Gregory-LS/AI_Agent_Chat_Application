<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agentic Chat</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sidebar-header">
      <button id="new-chat-btn" title="New conversation">+</button>
      <button id="settings-btn" title="Settings">⚙</button>
    </div>
    <div id="conversation-list"></div>
  </aside>
  <main id="main">
    <div id="chat-area">
      <div id="messages"></div>
      <div id="composer">
        <textarea id="message-input" placeholder="Type a message..."></textarea>
        <button id="send-btn">Send</button>
        <button id="stop-btn" style="display:none;">Stop</button>
      </div>
    </div>
  </main>
  <div id="settings-drawer" class="drawer hidden">
    <div class="drawer-header">
      <h2>Settings</h2>
      <button id="settings-close-btn">&times;</button>
    </div>
    <div class="drawer-content">
      <label for="api-key-input">OpenRouter API Key</label>
      <input type="password" id="api-key-input" placeholder="sk-or-...">
      <button id="save-api-key-btn">Save API Key</button>
      <label for="default-model-select">Default Model</label>
      <select id="default-model-select">
        <option value="">Loading models...</option>
      </select>
      <label for="theme-select">Theme</label>
      <select id="theme-select">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
      <button id="save-settings-btn">Save Settings</button>
      <div id="settings-status"></div>
    </div>
  </div>
  <div id="overlay" class="hidden"></div>
</div>
<script src="app.js"></script>
</body>
</html>
