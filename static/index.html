<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentic Chat</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div id="sidebar-header">
        <h1>Agentic Chat</h1>
        <button id="new-chat-btn" title="New conversation">+</button>
      </div>
      <div id="conversation-list">
        <!-- Dynamically populated -->
      </div>
      <div id="sidebar-footer">
        <button id="settings-btn" title="Settings">⚙️</button>
        <button id="skills-btn" title="Skills">🧠</button>
      </div>
    </aside>

    <!-- Main area -->
    <main id="chat-area">
      <div id="message-list">
        <!-- Messages appear here -->
      </div>
      <div id="composer">
        <textarea id="message-input" placeholder="Type your message..." rows="1"></textarea>
        <button id="send-btn" disabled>Send</button>
      </div>
    </main>

    <!-- Drawers and modals (hidden by default) -->
    <div id="settings-drawer" class="drawer hidden">
      <h2>Settings</h2>
      <label>API Key: <input type="password" id="api-key-input"></label>
      <label>Default Model: <select id="default-model-select"></select></label>
      <label>Theme: <select id="theme-select">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select></label>
      <button id="save-settings-btn">Save</button>
      <button id="close-settings-btn">Close</button>
    </div>

    <div id="skills-drawer" class="drawer hidden">
      <h2>Skills</h2>
      <div id="skills-list"></div>
      <button id="add-skill-btn">+ Add Skill</button>
      <button id="close-skills-btn">Close</button>
    </div>

    <div id="model-picker-modal" class="modal hidden">
      <div class="modal-content">
        <h2>Select Model</h2>
        <input type="text" id="model-search" placeholder="Search models...">
        <div id="model-list"></div>
        <button id="close-model-picker-btn">Close</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
