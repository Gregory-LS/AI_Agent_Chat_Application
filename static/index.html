<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Chat</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <!-- Sidebar -->
    <aside id="sidebar">
        <div class="sidebar-header">
            <h2>Chats</h2>
            <button id="new-chat-btn" title="New conversation">+</button>
        </div>
        <div class="sidebar-search">
            <input type="text" id="search-input" placeholder="Search conversations...">
        </div>
        <div id="conversation-list"></div>
        <div class="sidebar-footer">
            <button id="login-btn">Login / Register</button>
            <span id="user-display" style="display:none;"></span>
            <button id="logout-btn" style="display:none;">Logout</button>
            <button id="settings-btn">⚙️</button>
        </div>
    </aside>

    <!-- Main Chat Area -->
    <main id="chat-area">
        <div id="messages">
            <div class="welcome">
                <h1>Agentic Chat</h1>
                <p>Select a conversation or start a new one.</p>
            </div>
        </div>
        <div id="composer-area">
            <select id="model-select">
                <option value="openai/gpt-4o-mini">openai/gpt-4o-mini</option>
            </select>
            <textarea id="composer" placeholder="Type your message..." rows="3"></textarea>
            <button id="send-btn">Send</button>
        </div>
    </main>

    <!-- Settings Drawer -->
    <div id="settings-drawer" class="drawer">
        <div class="drawer-header">
            <h2>Settings</h2>
            <button id="settings-close">✕</button>
        </div>
        <div class="drawer-body">
            <label>API Key</label>
            <input type="password" id="api-key" placeholder="sk-or-...">
            <label>Theme</label>
            <button id="theme-toggle">🌙 Dark</button>
            <div id="balance-display"></div>
            <button id="save-settings">Save</button>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h2>Login</h2>
            <form id="login-form">
                <input type="text" id="login-username" placeholder="Username" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <hr>
            <h2>Register</h2>
            <form id="register-form">
                <input type="text" id="register-username" placeholder="Username" required>
                <input type="password" id="register-password" placeholder="Password (min 6 chars)" required>
                <button type="submit">Register</button>
            </form>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
