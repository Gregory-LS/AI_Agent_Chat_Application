<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Chat</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Sidebar -->
        <aside id="sidebar">
            <div id="sidebar-header">
                <h2>Agentic Chat</h2>
                <button id="new-chat-btn" title="New conversation">+</button>
            </div>
            <div id="user-section">
                <button id="login-btn" class="auth-btn">Log In</button>
                <button id="logout-btn" class="auth-btn" style="display:none;">Log Out</button>
                <span id="user-info" style="display:none;"></span>
            </div>
            <div id="conversation-list">
                <!-- Conversations loaded dynamically -->
            </div>
            <div id="sidebar-footer">
                <button id="settings-btn" title="Settings">⚙️</button>
            </div>
        </aside>

        <!-- Main chat area -->
        <main id="chat-area">
            <div id="messages">
                <!-- Messages loaded dynamically -->
            </div>
            <div id="composer">
                <textarea id="message-input" placeholder="Type a message..." rows="3"></textarea>
                <div id="composer-actions">
                    <button id="attach-btn" title="Attach file">📎</button>
                    <button id="send-btn" title="Send message">Send</button>
                    <button id="stop-btn" title="Stop generation" style="display:none;">Stop</button>
                </div>
            </div>
        </main>

        <!-- Auth Modal -->
        <div id="auth-modal" class="modal" style="display:none;">
            <div class="modal-content">
                <span class="close-btn" onclick="hideAuthModal()">&times;</span>
                <h2>Authentication</h2>
                <div id="auth-tabs">
                    <button onclick="showLoginForm()" class="tab-btn active">Log In</button>
                    <button onclick="showRegisterForm()" class="tab-btn">Register</button>
                </div>
                <form id="login-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="login-username">Username</label>
                        <input type="text" id="login-username" name="username" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" name="password" required>
                    </div>
                    <button type="submit" class="btn-primary">Log In</button>
                </form>
                <form id="register-form" onsubmit="handleRegister(event)" style="display:none;">
                    <div class="form-group">
                        <label for="register-username">Username</label>
                        <input type="text" id="register-username" name="username" required>
                    </div>
                    <div class="form-group">
                        <label for="register-password">Password</label>
                        <input type="password" id="register-password" name="password" required minlength="6">
                    </div>
                    <button type="submit" class="btn-primary">Register</button>
                </form>
            </div>
        </div>

        <!-- Settings Drawer -->
        <div id="settings-drawer" class="drawer" style="display:none;">
            <!-- Settings content -->
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
