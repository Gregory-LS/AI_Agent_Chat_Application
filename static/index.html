<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Chat</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <!-- Login Page -->
    <div id="login-page">
        <div class="login-container">
            <h1>Agentic Chat</h1>
            <form id="login-form">
                <input type="text" id="login-username" placeholder="Username" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit">Login</button>
                <p><a href="#" id="show-register">Create an account</a></p>
            </form>
            <div id="register-section" style="display:none;">
                <form id="register-form">
                    <input type="text" id="reg-username" placeholder="Username" required>
                    <input type="password" id="reg-password" placeholder="Password" required>
                    <input type="password" id="reg-confirm" placeholder="Confirm password" required>
                    <button type="submit">Register</button>
                    <p><a href="#" id="show-login">Already have an account? Login</a></p>
                </form>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" style="display:none;">
        <!-- Sidebar -->
        <aside id="sidebar">
            <div class="sidebar-header">
                <h2>Conversations</h2>
                <button id="new-chat-btn">+ New Chat</button>
            </div>
            <div class="sidebar-search">
                <input type="text" id="search-input" placeholder="Search conversations...">
            </div>
            <div id="conversation-list"></div>
            <div class="sidebar-footer">
                <button id="skills-btn">Skills</button>
                <button id="settings-btn">Settings</button>
                <button id="logout-btn">Logout</button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main id="chat-area">
            <header id="chat-header">
                <span id="current-model">Model: <span id="model-name">openai/gpt-4o</span></span>
                <button id="model-picker-btn">Change Model</button>
            </header>
            <div id="chat-messages">
                <div class="empty-state">Select or create a conversation to start chatting.</div>
            </div>
            <footer id="composer">
                <textarea id="message-input" placeholder="Type a message..." rows="3"></textarea>
                <button id="send-btn">Send</button>
                <button id="stop-btn" style="display:none;">Stop</button>
            </footer>
        </main>

        <!-- Settings Drawer -->
        <div id="settings-drawer" class="drawer">
            <div class="drawer-header">
                <h3>Settings</h3>
                <button id="settings-close">✕</button>
            </div>
            <div class="drawer-body">
                <label>API Key
                    <input type="password" id="settings-api-key" placeholder="sk-or-...">
                </label>
                <label>Default Model
                    <input type="text" id="settings-default-model" placeholder="openai/gpt-4o">
                </label>
                <label>Dark Theme
                    <input type="checkbox" id="theme-toggle">
                </label>
                <button id="settings-save">Save</button>
            </div>
        </div>

        <!-- Skills Drawer -->
        <div id="skills-drawer" class="drawer">
            <div class="drawer-header">
                <h3>Skills</h3>
                <button id="skills-close">✕</button>
            </div>
            <div class="drawer-body">
                <button id="add-skill-btn">+ Add Skill</button>
                <div id="skills-list"></div>
            </div>
        </div>

        <!-- Model Picker Drawer -->
        <div id="model-picker-drawer" class="drawer">
            <div class="drawer-header">
                <h3>Select Model</h3>
                <button id="model-picker-close">✕</button>
            </div>
            <div class="drawer-body">
                <input type="text" id="model-search" placeholder="Search models...">
                <div id="model-list"></div>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
