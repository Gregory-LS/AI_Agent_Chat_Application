<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agentic Chat</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <button id="new-chat-btn" title="New conversation (Ctrl+Shift+N)">+ New Chat</button>
      <button id="settings-btn" title="Settings (Ctrl+Shift+,)">&#9881;</button>
      <button id="skills-btn" title="Skills (Ctrl+Shift+E)">&#9881;</button>
    </div>
    <div id="conversation-list" class="conversation-list">
      <input id="search-conversations" type="text" placeholder="Search conversations..." />
      <div id="conversations"></div>
    </div>
    <div class="sidebar-footer">
      <button id="clear-conversations-btn" title="Clear all conversations (Ctrl+Shift+Delete)">Clear All</button>
    </div>
  </aside>
  <main id="main" class="main">
    <header id="chat-header" class="chat-header">
      <span id="model-name"></span>
      <button id="model-picker-btn">Change Model</button>
      <button id="stop-btn" class="hidden">Stop</button>
    </header>
    <div id="messages" class="messages"></div>
    <div id="composer" class="composer">
      <textarea id="message-input" placeholder="Type a message..." rows="3"></textarea>
      <div class="composer-actions">
        <button id="attach-btn" title="Attach file">&#128206;</button>
        <button id="send-btn" title="Send message">Send</button>
      </div>
    </div>
  </main>
</div>

<!-- Overlay -->
<div id="overlay" class="overlay hidden"></div>

<!-- Settings Drawer -->
<div id="settings-drawer" class="drawer hidden">
  <div class="drawer-header">
    <h2>Settings</h2>
    <button id="settings-close-btn" class="close-btn">&times;</button>
  </div>
  <div class="drawer-body">
    <label for="api-key-input">API Key</label>
    <input type="password" id="api-key-input" placeholder="sk-or-..." />
    <label for="default-model-input">Default Model</label>
    <input type="text" id="default-model-input" placeholder="openai/gpt-4o" />
    <label for="theme-select">Theme</label>
    <select id="theme-select">
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
    <button id="save-settings-btn">Save</button>
    <button id="logout-btn">Logout</button>
    <div id="balance-info"></div>
  </div>
</div>

<!-- Skills Drawer -->
<div id="skills-drawer" class="drawer hidden">
  <div class="drawer-header">
    <h2>Skills</h2>
    <button id="skills-close-btn" class="close-btn">&times;</button>
  </div>
  <div class="drawer-body">
    <div id="skills-list"></div>
    <button id="add-skill-btn">+ Add Skill</button>
  </div>
</div>

<!-- Model Picker Drawer -->
<div id="model-picker-drawer" class="drawer hidden">
  <div class="drawer-header">
    <h2>Select Model</h2>
    <button id="model-picker-close-btn" class="close-btn">&times;</button>
  </div>
  <div class="drawer-body">
    <input type="text" id="model-search" placeholder="Search models..." />
    <div id="model-list"></div>
  </div>
</div>

<!-- Settings Modal -->
<div id="settings-modal" class="modal hidden">
  <div class="modal-content">
    <span id="settings-modal-close" class="modal-close">&times;</span>
    <h2>Settings</h2>
    <label for="modal-api-key">API Key</label>
    <input type="password" id="modal-api-key" />
    <label for="modal-default-model">Default Model</label>
    <input type="text" id="modal-default-model" />
    <label for="modal-theme">Theme</label>
    <select id="modal-theme">
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
    <button id="modal-save-settings">Save Settings</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
