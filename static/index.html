<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agentic Chat</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div id="sidebar-header">
      <h2>Conversations</h2>
      <button id="new-chat-btn" title="New conversation">+</button>
    </div>
    <div id="conversation-list"></div>
    <div id="sidebar-footer">
      <button id="settings-btn" title="Settings">⚙️ Settings</button>
    </div>
  </aside>
  <main id="main">
    <header id="chat-header">
      <div id="model-picker">
        <select id="model-select"></select>
      </div>
      <div id="skills-area"></div>
    </header>
    <div id="messages"></div>
    <div id="composer">
      <textarea id="message-input" placeholder="Type a message..." rows="1"></textarea>
      <button id="send-btn" disabled>Send</button>
      <button id="stop-btn" style="display:none">Stop</button>
    </div>
  </main>
</div>

<!-- Settings Modal -->
<div id="settings-modal" class="modal-backdrop" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <h2>Settings</h2>
      <button class="modal-close" id="settings-close-btn">&times;</button>
    </div>
    <div class="modal-body">
      <label for="settings-api-key">OpenRouter API Key</label>
      <input type="password" id="settings-api-key" placeholder="sk-or-..." />
      <label for="settings-default-model">Default Model</label>
      <select id="settings-default-model"></select>
    </div>
    <div class="modal-footer">
      <button id="settings-save-btn">Save</button>
      <button id="settings-cancel-btn">Cancel</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
