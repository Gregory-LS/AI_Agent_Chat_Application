<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentic Chat</title>
  <link rel="stylesheet" href="static/styles.css">
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div id="sidebar-header">
        <h1>Agentic Chat</h1>
        <button id="new-chat" title="New conversation">+</button>
      </div>
      <div id="conversation-list"></div>
      <div id="sidebar-footer">
        <button id="settings-btn" title="Settings">&#9881;</button>
        <button id="logout-btn" title="Logout">&#128682;</button>
        <span id="model-indicator">Model: None</span>
      </div>
    </aside>

    <!-- Main chat area -->
    <main id="chat-area">
      <div id="messages"></div>
      <div id="composer">
        <textarea id="composer-input" placeholder="Type a message..." rows="1"></textarea>
        <button id="send-btn" disabled>Send</button>
        <button id="stop-btn" style="display:none">Stop</button>
      </div>
    </main>

    <!-- Modals and drawers -->
    <div id="settings-drawer" class="drawer hidden">
      <div class="drawer-content">
        <h2>Settings</h2>
        <label>API Key
          <input type="password" id="api-key-input" placeholder="sk-or-...">
        </label>
        <label>Default Model
          <select id="default-model-select"></select>
        </label>
        <label>Theme
          <select id="theme-select">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
        <button id="save-settings">Save</button>
        <button id="close-settings">Close</button>
      </div>
    </div>

    <div id="model-picker-modal" class="modal hidden">
      <div class="modal-content">
        <h2>Select Model</h2>
        <input type="text" id="model-search" placeholder="Search models...">
        <div id="model-list"></div>
        <button id="close-model-picker">Close</button>
      </div>
    </div>
  </div>
  <script src="static/app.js"></script>
</body>
</html>
