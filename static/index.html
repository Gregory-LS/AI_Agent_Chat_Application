<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Chat</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div id="app">
        <!-- Sidebar -->
        <aside id="sidebar">
            <div class="sidebar-header">
                <h1>Agentic Chat</h1>
                <button id="new-conv-btn" class="btn-primary">+ New</button>
            </div>
            <div id="conversation-list" class="conversation-list">
                <!-- Conversations rendered by JS -->
            </div>
            <div class="sidebar-footer">
                <button id="settings-btn" class="btn-icon" title="Settings">⚙️</button>
                <button id="skills-btn" class="btn-icon" title="Skills">🧠</button>
                <button id="theme-toggle" class="btn-icon" title="Toggle theme">🌙</button>
                <button id="logout-btn" class="btn-icon" title="Logout">🚪</button>
            </div>
        </aside>

        <!-- Main chat area -->
        <main id="chat-area">
            <div class="empty-state">Select a conversation or start a new one</div>
        </main>

        <!-- Composer -->
        <div id="composer">
            <form id="composer-form">
                <textarea id="message-input" placeholder="Type your message..." rows="3"></textarea>
                <div class="composer-actions">
                    <button type="submit" class="btn-primary">Send</button>
                    <button type="button" id="stop-btn" class="btn-secondary" style="display:none;">Stop</button>
                </div>
            </form>
        </div>

        <!-- Settings Drawer -->
        <div id="settings-drawer" class="drawer">
            <div class="drawer-header">
                <h2>Settings</h2>
                <button class="btn-icon close-drawer" onclick="closeSettings()">✕</button>
            </div>
            <div class="drawer-content">
                <label>
                    API Key:
                    <input type="password" id="api-key-input" placeholder="sk-or-...">
                </label>
                <label>
                    Default Model:
                    <input type="text" id="default-model-input" placeholder="openai/gpt-4o">
                </label>
                <button id="save-settings-btn" class="btn-primary">Save</button>
            </div>
        </div>

        <!-- Skills Drawer -->
        <div id="skills-drawer" class="drawer">
            <div class="drawer-header">
                <h2>Skills</h2>
                <button class="btn-icon close-drawer" onclick="closeSkills()">✕</button>
            </div>
            <div id="skills-list" class="drawer-content">
                <!-- Skills rendered by JS -->
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
